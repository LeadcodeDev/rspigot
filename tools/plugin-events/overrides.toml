[events.PlayerMove]
unread = { setFrom = "Spigot never reads it back: a cancel always sends the player to where the move started" }

[events.EntityTeleport]
unread = { setFrom = "Spigot never reads it back: no caller reads getFrom() after the event" }

[events.EntityPortal]
unread = { setFrom = "Spigot never reads it back: the portal search reads getTo(), the radii and getCanCreatePortal() only" }

[events.PlayerPortal]
unread = { setFrom = "Spigot never reads it back: the portal search reads getTo(), the radii and getCanCreatePortal() only" }

[events.EntityPortalExit]
unread = { setFrom = "Spigot never reads it back: Spigot 26.3 never fires this event" }

[events.PlayerCommandPreprocess]
unread = { setPlayer = "Spigot reads it back only for commands sent through Player.chat, never for a command packet" }

[events.PlayerInteract]
getters = ["useInteractedBlock", "useItemInHand"]

[events.PlayerBedEnter]
getters = ["useBed"]

[events.PlayerBedLeave]
pairs = { setSpawnLocation = "shouldSetSpawnLocation" }

[events.ThunderChange]
getters = ["toThunderState"]

[events.WeatherChange]
getters = ["toWeatherState"]

[events.EnchantItem]
getters = ["whichButton"]

[events.ServerListPing]
getters = ["iterator"]
rename = { iterator = "players" }
extra = [
    { name = "hidden_players", java = "java.util.List<java.util.UUID>", patch = true, number = 100, reason = "Spigot reads back the players removed through iterator(): they leave the sample and the count" },
]

[events.PlayerDropItem]
omit = { getItemDrop = "the item entity does not exist until the drop applies; item carries its stack" }
extra = [
    { name = "item", java = "org.bukkit.inventory.ItemStack", patch = true, number = 100, reason = "Spigot reads getItemDrop().getItemStack() back after the event" },
]

[events.PlayerPickupArrow]
omit = { getItem = "the item entity never enters the world; item carries its stack" }
extra = [
    { name = "item", java = "org.bukkit.inventory.ItemStack", number = 100, reason = "the stack the arrow gives, read-only: a plugin out of process cannot write through the item handle" },
]

[events.AsyncPlayerChat]
collections = ["getRecipients"]

[events.BroadcastMessage]
collections = ["getRecipients"]

[events.PlayerHarvestBlock]
collections = ["getItemsHarvested"]

[events.EntityExplode]
