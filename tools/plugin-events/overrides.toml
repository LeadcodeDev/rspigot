[events.PlayerMove]
unread = { setFrom = "Spigot never reads it back: a cancel always sends the player to where the move started" }

[events.PlayerCommandPreprocess]
unread = { setPlayer = "Spigot reads it back only for commands sent through Player.chat, never for a command packet" }

[events.PlayerInteract]
getters = ["useInteractedBlock", "useItemInHand"]
cancel_sets = { useInteractedBlock = "DENY", useItemInHand = "DENY" }

[events.PlayerBedEnter]
getters = ["useBed"]

[events.PlayerBedLeave]
pairs = { setSpawnLocation = "shouldSetSpawnLocation" }

[events.ThunderChange]
getters = ["toThunderState"]

[events.WeatherChange]
getters = ["toWeatherState"]

[events.EnchantItem]
getters = ["whichButton"]

[events.ServerListPing]
getters = ["iterator"]
rename = { iterator = "players" }

[events.EntityExplode]
getters = ["blockList"]
collections = ["blockList"]
rename = { yield = "explosion_yield" }

[events.BlockExplode]
getters = ["blockList"]
collections = ["blockList"]
rename = { yield = "explosion_yield" }

[events.EntityDeath]
collections = ["getDrops"]

[events.PlayerDeath]
collections = ["getDrops"]

[events.BlockDropItem]
collections = ["getItems"]

[events.PlayerCommandSend]
collections = ["getCommands"]

[events.SignChange]
collections = ["getLines"]
omit = { "getLine(int)" = "lines() holds every line", "setLine(int, String)" = "set_lines replaces every line" }

[events.InventoryClick]
revive = ["setCursor"]
applies_when_cancelled = ["setCurrentItem", "setCursor"]

[events.CraftItem]
revive = ["setCursor"]
applies_when_cancelled = ["setCurrentItem", "setCursor"]

[events.SmithItem]
revive = ["setCursor"]
applies_when_cancelled = ["setCurrentItem", "setCursor"]

[events.InventoryCreative]
applies_when_cancelled = ["setCurrentItem", "setCursor"]

[events.PrepareItemCraft]
extra = [
    { name = "result", java = "org.bukkit.inventory.ItemStack", nullable = true, patch = true, number = 100, reason = "Spigot reads getInventory().getResult() back after the event" },
]

[events.InventoryClose]
extra = [
    { name = "by_player", java = "boolean", number = 100, reason = "rspigot: true when the player closed the inventory, false when the server or a plugin did" },
]

[events.AsyncPlayerPreLogin]
omit = { allow = "set_login_result(Allowed) does the same", "disallow(AsyncPlayerPreLoginEvent$Result, String)" = "set_login_result and set_kick_message do the same" }

[events.PlayerLogin]
omit = { allow = "set_result(Allowed) does the same", "disallow(PlayerLoginEvent$Result, String)" = "set_result and set_kick_message do the same" }

[events.EntityDamage]
omit = { "getDamage(EntityDamageEvent$DamageModifier)" = "per-modifier damage is left out: rspigot applies armor and effects after the event", "getOriginalDamage(EntityDamageEvent$DamageModifier)" = "per-modifier damage is left out: rspigot applies armor and effects after the event", "isApplicable(EntityDamageEvent$DamageModifier)" = "per-modifier damage is left out: rspigot applies armor and effects after the event", "setDamage(EntityDamageEvent$DamageModifier, double)" = "per-modifier damage is left out: rspigot applies armor and effects after the event" }

[events.EntityDamageByBlock]
omit = { "getDamage(EntityDamageEvent$DamageModifier)" = "per-modifier damage is left out: rspigot applies armor and effects after the event", "getOriginalDamage(EntityDamageEvent$DamageModifier)" = "per-modifier damage is left out: rspigot applies armor and effects after the event", "isApplicable(EntityDamageEvent$DamageModifier)" = "per-modifier damage is left out: rspigot applies armor and effects after the event", "setDamage(EntityDamageEvent$DamageModifier, double)" = "per-modifier damage is left out: rspigot applies armor and effects after the event" }

[events.EntityDamageByEntity]
omit = { "getDamage(EntityDamageEvent$DamageModifier)" = "per-modifier damage is left out: rspigot applies armor and effects after the event", "getOriginalDamage(EntityDamageEvent$DamageModifier)" = "per-modifier damage is left out: rspigot applies armor and effects after the event", "isApplicable(EntityDamageEvent$DamageModifier)" = "per-modifier damage is left out: rspigot applies armor and effects after the event", "setDamage(EntityDamageEvent$DamageModifier, double)" = "per-modifier damage is left out: rspigot applies armor and effects after the event" }

[events.PotionSplash]
omit = { "getIntensity(LivingEntity)" = "per-entity intensity is left out until thrown potions exist", "setIntensity(LivingEntity, double)" = "per-entity intensity is left out until thrown potions exist" }

[events.AsyncStructureGenerate]
omit = { clearBlockTransformers = "transformers are Java callbacks", clearEntityTransformers = "transformers are Java callbacks", "removeBlockTransformer(NamespacedKey)" = "transformers are Java callbacks", "removeEntityTransformer(NamespacedKey)" = "transformers are Java callbacks" }

[events.EntityPotionEffect]
rename = { override = "overrides" }

[events.InventoryDrag]
rename = { type = "drag_type" }

[events.ServerLoad]
rename = { type = "load_type" }

[events.PlayerCustomClick]
rename = { id = "click_id" }

[events.PlayerResourcePackStatus]
rename = { iD = "pack_id" }
