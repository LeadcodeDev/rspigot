[package]
name = "rspigot-plugins"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
rspigot-core = { workspace = true }
rspigot-domain = { workspace = true }
rspigot-plugin-protocol = { workspace = true }
crossbeam-channel = "0.5"
thiserror = "2"
tokio = { version = "1", features = ["net", "rt", "sync", "macros"] }
tokio-stream = "0.1"
tonic = "0.14"
tonic-health = "0.14"
tracing = "0.1"
uuid = "1"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }

[lints]
workspace = true
