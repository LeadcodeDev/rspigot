message PlayerStatisticIncrement { optional string entity_type = 1; optional string material = 2; int32 new_value = 3; PlayerSnapshot player = 4; int32 previous_value = 5; Statistic statistic = 6; }
message PlayerSwapHandItems { Item main_hand_item = 1; Item off_hand_item = 2; PlayerSnapshot player = 3; }
message PlayerSwapHandItemsPatch { NullableItem main_hand_item = 1; NullableItem off_hand_item = 2; }
message PlayerTakeLecternBook { Item book = 1; LecternData lectern = 2; PlayerSnapshot player = 3; }
message PlayerTeleport { PlayerTeleportCause cause = 1; Location from = 2; PlayerSnapshot player = 3; Location to = 4; }
message PlayerTeleportPatch { Location from = 2; Location to = 4; }
message PlayerToggleFlight { bool flying = 1; PlayerSnapshot player = 2; }
message PlayerToggleSneak { PlayerSnapshot player = 1; bool sneaking = 2; }
message PlayerToggleSprint { PlayerSnapshot player = 1; bool sprinting = 2; }
message PlayerUnleashEntity { EntitySnapshot entity = 1; string entity_type = 2; EquipmentSlot hand = 3; PlayerSnapshot player = 4; EntityUnleashReason reason = 5; }
message PlayerVelocity { PlayerSnapshot player = 1; Vec3 velocity = 2; }
message PlayerVelocityPatch { Vec3 velocity = 2; }
message PluginDisable { PluginInfo plugin = 1; }
message PluginEnable { PluginInfo plugin = 1; }
message PortalCreate { repeated BlockSnapshot blocks = 1; EntitySnapshot entity = 2; PortalCreateReason reason = 3; string world = 4; }
message PotionSplash { repeated EntitySnapshot affected_entities = 1; EntitySnapshot entity = 2; string entity_type = 3; repeated EntitySnapshotDoubleEntry intensities = 4; BlockPos hit_block = 5; optional Face hit_block_face = 6; EntitySnapshot hit_entity = 7; EntitySnapshot potion = 9; }
message PotionSplashPatch { repeated EntitySnapshotDoubleEntry intensities = 4; }
message PrepareAnvil { InventoryRef inventory = 1; Item result = 2; InventoryView view = 3; repeated PlayerSnapshot viewers = 4; }
message PrepareAnvilPatch { NullableItem result = 2; }
message PrepareGrindstone { InventoryRef inventory = 1; Item result = 2; InventoryView view = 3; repeated PlayerSnapshot viewers = 4; }
message PrepareGrindstonePatch { NullableItem result = 2; }
message PrepareItemCraft { InventoryRef inventory = 1; optional string recipe = 2; bool repair = 3; InventoryView view = 4; repeated PlayerSnapshot viewers = 5; Item result = 100; }
message PrepareItemCraftPatch { NullableItem result = 100; }
message PrepareItemEnchant { BlockPos enchant_block = 1; PlayerSnapshot enchanter = 2; int32 enchantment_bonus = 3; InventoryRef inventory = 5; Item item = 6; repeated EnchantOffer offers = 7; InventoryView view = 8; repeated PlayerSnapshot viewers = 9; }
message PrepareSmithing { InventoryRef inventory = 1; Item result = 2; InventoryView view = 3; repeated PlayerSnapshot viewers = 4; }
message PrepareSmithingPatch { NullableItem result = 2; }
message ProjectileHit { EntitySnapshot entity = 1; string entity_type = 2; BlockPos hit_block = 3; optional Face hit_block_face = 4; EntitySnapshot hit_entity = 5; }
message ProjectileLaunch { EntitySnapshot entity = 1; string entity_type = 2; Location location = 3; }
message RaidFinish { repeated PlayerSnapshot winners = 2; string world = 3; }
message RaidSpawnWave { EntitySnapshot patrol_leader = 1; repeated EntitySnapshot raiders = 3; string world = 4; }
message RaidStop { RaidStopReason reason = 2; string world = 3; }
message RaidTrigger { PlayerSnapshot player = 1; string world = 3; }
message RemoteServerCommand { string command = 1; CommandSender sender = 2; }
message RemoteServerCommandPatch { optional string command = 1; }
message SculkBloom { BlockPos block = 1; int32 charge = 2; }
message SculkBloomPatch { optional int32 charge = 2; }
message ServerCommand { string command = 1; CommandSender sender = 2; }
message ServerCommandPatch { optional string command = 1; }
message ServerListPing { string address = 1; string hostname = 2; repeated PlayerSnapshot players = 3; int32 max_players = 4; string motd = 5; int32 num_players = 6; repeated string hidden_players = 100; }
message ServerListPingPatch { optional int32 max_players = 4; optional string motd = 5; optional bytes server_icon = 8; StringList hidden_players = 100; }
message ServerLoad { ServerLoadType load_type = 1; }
message SheepDyeWool { DyeColor color = 1; EntitySnapshot entity = 2; string entity_type = 3; PlayerSnapshot player = 4; }
message SheepDyeWoolPatch { optional DyeColor color = 1; }
message SheepRegrowWool { EntitySnapshot entity = 1; string entity_type = 2; }
message SignChange { BlockPos block = 1; repeated string lines = 4; PlayerSnapshot player = 5; Side side = 6; }
message SignChangePatch { StringList lines = 4; }
message SmithItem { InventoryAction action = 1; ClickKind click = 2; InventoryRef clicked_inventory = 3; Item current_item = 4; Item cursor = 5; int32 hotbar_button = 6; InventoryRef inventory = 7; bool left_click = 8; int32 raw_slot = 9; EventResult result = 10; bool right_click = 11; bool shift_click = 12; int32 slot = 13; InventoryTypeSlotType slot_type = 14; InventoryView view = 15; repeated PlayerSnapshot viewers = 16; PlayerSnapshot who_clicked = 17; }
message SmithItemPatch { NullableItem current_item = 4; NullableItem cursor = 5; optional EventResult result = 10; }
message SpawnChange { Location previous_location = 1; string world = 2; }
message SpawnerSpawn { EntitySnapshot entity = 1; string entity_type = 2; Location location = 3; SpawnerData spawner = 4; }
message SpongeAbsorb { BlockPos block = 1; repeated BlockSnapshot blocks = 2; }
message StriderTemperatureChange { EntitySnapshot entity = 1; string entity_type = 2; bool shivering = 3; }
message StructureGrow { repeated BlockSnapshot blocks = 1; bool from_bonemeal = 2; Location location = 3; PlayerSnapshot player = 4; TreeType species = 5; string world = 6; }
message TNTPrime { BlockPos block = 1; TNTPrimeCause cause = 2; BlockPos priming_block = 3; EntitySnapshot priming_entity = 4; }
message TabComplete { string buffer = 1; repeated string completions = 2; CommandSender sender = 3; }
message TabCompletePatch { StringList completions = 2; }
message ThunderChange { bool to_thunder_state = 1; string world = 2; }
message TimeSkip { int64 skip_amount = 1; TimeSkipReason skip_reason = 2; string world = 3; }
message TimeSkipPatch { optional int64 skip_amount = 1; }
message TradeSelect { int32 index = 1; InventoryRef inventory = 2; MerchantRef merchant = 3; EventResult result = 4; InventoryView view = 5; repeated PlayerSnapshot viewers = 6; PlayerSnapshot who_clicked = 7; }
message TradeSelectPatch { optional EventResult result = 4; }
message TrialSpawnerSpawn { EntitySnapshot entity = 1; string entity_type = 2; Location location = 3; TrialSpawnerData trial_spawner = 4; }
message VaultDisplayItem { BlockPos block = 1; Item display_item = 2; }
message VaultDisplayItemPatch { NullableItem display_item = 2; }
