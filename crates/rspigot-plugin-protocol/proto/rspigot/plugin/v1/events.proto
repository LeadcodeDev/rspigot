message VehicleExit { EntitySnapshot exited = 1; EntitySnapshot vehicle = 2; }
message VehicleMove { Location from = 1; Location to = 2; EntitySnapshot vehicle = 3; }
message VehicleUpdate { EntitySnapshot vehicle = 1; }
